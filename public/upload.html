<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dibbi Paperless Vault</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b132b; color: #f8fafc; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1c2541; padding: 22px; border-radius: 20px; border: 1px solid #2a3a5e; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .logo { font-size: 22px; font-weight: bold; color: #38bdf8; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .subtitle { font-size: 12px; color: #94a3b8; margin-bottom: 16px; }
        
        .status-pill { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 18px; background: #15803d; color: #ffffff; }

        .form-group { text-align: left; margin-bottom: 14px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        label { font-size: 12px; font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 6px; }
        input[type="text"], input[type="tel"], select, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 10px; font-size: 14px; background: #0f172a; color: white; outline: none; }
        input[type="file"] { font-size: 11px; padding: 8px; }
        
        .sig-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .clear-btn { background: #ef4444; color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        
        .sig-container { background: #ffffff; border-radius: 12px; border: 2px dashed #0284c7; touch-action: none; overflow: hidden; }
        canvas { width: 100%; height: 160px; display: block; cursor: crosshair; }

        .btn-submit { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 15px; }
        
        .token-card { display: none; margin-top: 15px; background: #064e3b; border: 1px solid #10b981; padding: 16px; border-radius: 14px; }
        .token-number { font-size: 30px; font-weight: bold; color: #34d399; margin: 4px 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🍃 Dibbi Paperless Vault</div>
        <div class="subtitle">Hotel Guest Verification • Digital Check-In</div>
        
        <div id="connStatus" class="status-pill">🟢 Connected to Hotel Desk</div>

        <form id="uploadForm">
            <div class="form-group">
                <label>Guest Full Name *</label>
                <input type="text" id="guestName" placeholder="Enter Full Name" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Mobile Number *</label>
                    <input type="tel" id="mobile" placeholder="Mobile No." required>
                </div>
                <div class="form-group">
                    <label>Room No. *</label>
                    <input type="text" id="roomNo" placeholder="Room No." required>
                </div>
            </div>

            <div class="form-group">
                <label>Document Type *</label>
                <select id="docType" required>
                    <option value="Aadhaar Card">Aadhaar Card</option>
                    <option value="Passport">Passport</option>
                    <option value="Voter ID">Voter ID</option>
                    <option value="Driving License">Driving License</option>
                </select>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label>ID Front Side *</label>
                    <input type="file" id="frontFile" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>ID Back Side (Optional)</label>
                    <input type="file" id="backFile" accept="image/*">
                </div>
            </div>

            <div class="form-group">
                <div class="sig-header">
                    <label style="margin: 0;">Guest E-Signature *</label>
                    <button type="button" class="clear-btn" onclick="clearSignature()">Clear 🔄</button>
                </div>
                <div class="sig-container">
                    <canvas id="sigCanvas"></canvas>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">✓ Verified & Approved!</button>
        </form>

        <div class="token-card" id="tokenBox">
            <div style="font-size: 11px; color: #a7f3d0; letter-spacing: 1px;">CHECK-IN SUCCESSFUL</div>
            <div class="token-number" id="tokenNo">TOKEN #101</div>
            <div style="font-size: 12px; color: #6ee7b7;">Paperless Verification Complete</div>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('sigCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, hasSigned = false, points = [];

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000000';
            drawBaseline(rect.width, rect.height);
        }

        function drawBaseline(width, height) {
            ctx.save(); ctx.beginPath(); ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]); ctx.moveTo(15, height - 30); ctx.lineTo(width - 15, height - 30); ctx.stroke(); ctx.restore();
        }

        window.addEventListener('load', resizeCanvas);

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: (e.touches ? e.touches[0].clientX : e.clientX) - rect.left, y: (e.touches ? e.touches[0].clientY : e.clientY) - rect.top };
        }

        function startDrawing(e) { e.preventDefault(); isDrawing = true; hasSigned = true; points = [getPos(e)]; }
        function draw(e) {
            if (!isDrawing) return; e.preventDefault();
            const pos = getPos(e); points.push(pos);
            if (points.length < 3) return;
            ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length - 1; i++) {
                ctx.quadraticCurveTo(points[i].x, points[i].y, (points[i].x + points[i + 1].x) / 2, (points[i].y + points[i + 1].y) / 2);
            }
            ctx.stroke();
        }
        function stopDrawing() { isDrawing = false; points = []; }

        canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false }); canvas.addEventListener('touchmove', draw, { passive: false }); canvas.addEventListener('touchend', stopDrawing);

        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasSigned = false; points = [];
            const rect = canvas.getBoundingClientRect(); drawBaseline(rect.width, rect.height);
        }

        function fileToBase64(file) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        function getSolidSignatureData() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.fillStyle = '#ffffff'; tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(canvas, 0, 0);
            return tempCanvas.toDataURL('image/jpeg', 0.9);
        }

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!hasSigned) return alert("Please sign before submitting!");

            const frontFile = document.getElementById('frontFile').files[0];
            const backFile = document.getElementById('backFile').files[0];

            const frontBase64 = await fileToBase64(frontFile);
            const backBase64 = await fileToBase64(backFile);

            document.getElementById('submitBtn').innerText = "Submitting Data...";
            document.getElementById('submitBtn').disabled = true;

            socket.emit('send-document', {
                guestName: document.getElementById('guestName').value,
                mobile: document.getElementById('mobile').value,
                roomNo: document.getElementById('roomNo').value,
                docType: document.getElementById('docType').value,
                frontImage: frontBase64,
                backImage: backBase64,
                signatureData: getSolidSignatureData()
            });
        });

        socket.on('document-verified-reply', (data) => {
            document.getElementById('tokenBox').style.display = 'block';
            document.getElementById('tokenNo').innerText = `TOKEN #${data.token}`;
            document.getElementById('submitBtn').style.display = 'none';
        });
    </script>
</body>
</html>
