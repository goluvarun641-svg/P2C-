<!-- Dashboard Top Bar Mein Yeh Button Add Karein -->
<button onclick="exportToExcel()" style="background: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; float: right;">
    📥 Export Excel Register
</button>

<script>
    const socket = io();
    let allGuestRecords = {};

    // Server restart/shutdown hone ke baad purana saara data wapas load hoga
    socket.on('load-initial-data', (records) => {
        allGuestRecords = records || {};
        renderDashboardList();
    });

    socket.on('receive-document', (record) => {
        allGuestRecords[record.token] = record;
        renderDashboardList();
    });

    function renderDashboardList() {
        const listContainer = document.getElementById('guestListContainer');
        if (!listContainer) return;
        
        listContainer.innerHTML = '';
        const tokens = Object.keys(allGuestRecords).reverse(); // Latest pehle

        tokens.forEach(token => {
            const item = allGuestRecords[token];
            const card = document.createElement('div');
            card.className = 'guest-card';
            card.innerHTML = `
                <div style="display:flex; justify-between; align-items:center;">
                    <h3>Token #${item.token} - ${item.guestName}</h3>
                    <small>${item.date || ''} ${item.time || ''}</small>
                </div>
                <p>Room: <b>${item.roomNo}</b> | Mobile: ${item.mobile} | ID: ${item.docType}</p>
                <button onclick="openPrintPreview(${item.token})">🖨️ Print GRC Slip</button>
            `;
            listContainer.appendChild(card);
        });
    }

    // Single Click Excel Export Function (Police / Audit Register)
    function exportToExcel() {
        const tokens = Object.keys(allGuestRecords);
        if (tokens.length === 0) {
            alert("Export karne ke liye koi data nahi hai!");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Token,Date,Time,Guest Name,Mobile,Room No,Doc Type,Front Image Path,Back Image Path\n";

        tokens.forEach(token => {
            const r = allGuestRecords[token];
            const row = [
                `"${r.token}"`,
                `"${r.date || ''}"`,
                `"${r.time || ''}"`,
                `"${r.guestName}"`,
                `"${r.mobile}"`,
                `"${r.roomNo}"`,
                `"${r.docType}"`,
                `"${r.frontImage || ''}"`,
                `"${r.backImage || ''}"`
            ].join(",");
            csvContent += row + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Hotel_Guest_Register_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
